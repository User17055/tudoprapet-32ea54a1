# Roda os testes do site e das edge functions em todo push e pull request.
#
# Por que existe: o Lovable commita direto na main, e os testes (vitest, tsc e Deno)
# só rodavam quando alguém lembrava. A trava do corte de 1000 linhas
# (src/test/paginationGuard.test.ts) já ficou vermelha na main sem ninguém ver.
#
# Só lê o código: não publica nada, não usa secrets e não muda o site.

name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site (vitest e tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: vitest
        run: npm test

      - name: tsc
        run: npx tsc --noEmit -p tsconfig.app.json

  functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno check
        run: deno check supabase/functions/*/index.ts

      - name: deno test
        run: deno test --allow-env supabase/functions/
